name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gateway and script syntax
        run: |
          node --check server/index.mjs
          node --check scripts/preflight.mjs
          node --check scripts/check-fns-schema.mjs
          node --check scripts/test-gateway.mjs
      - name: Offline invariants
        run: npm run preflight
      - name: Gateway smoke test
        run: npm run gateway:test
      - run: npm install
      - run: npm run build
