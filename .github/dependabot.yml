version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - '@vitejs/*'
          - vite
      backend:
        patterns:
          - jose
          - pg
          - '@supabase/*'

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
