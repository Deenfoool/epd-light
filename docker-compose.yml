services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - epd_internal

  gateway:
    build:
      context: ./server
    environment:
      PORT: "8787"
      EPD_OPERATOR_PROVIDER: ${EPD_OPERATOR_PROVIDER:-none}
      EPD_OPERATOR_MODE: ${EPD_OPERATOR_MODE:-disabled}
      EPD_MAX_BODY_BYTES: ${EPD_MAX_BODY_BYTES:-524288}
      EPD_ALLOWED_ORIGINS: ${EPD_ALLOWED_ORIGINS:-}
      EPD_GATEWAY_AUTH_MODE: ${EPD_GATEWAY_AUTH_MODE:-disabled}
      EPD_AUTH_SUPABASE_URL: ${EPD_AUTH_SUPABASE_URL:-}
      EPD_AUTH_AUDIENCE: ${EPD_AUTH_AUDIENCE:-authenticated}
      EPD_AUTH_CLIENT_ID: ${EPD_AUTH_CLIENT_ID:-}
      EPD_RATE_LIMIT_WINDOW_MS: ${EPD_RATE_LIMIT_WINDOW_MS:-60000}
      EPD_RATE_LIMIT_MAX: ${EPD_RATE_LIMIT_MAX:-60}
      EPD_AUTH_ATTEMPT_LIMIT_MAX: ${EPD_AUTH_ATTEMPT_LIMIT_MAX:-120}
      EPD_KONTUR_BOX_ID: ${EPD_KONTUR_BOX_ID:-}
      EPD_KONTUR_ACCESS_TOKEN: ${EPD_KONTUR_ACCESS_TOKEN:-}
    expose:
      - "8787"
    restart: unless-stopped
    networks:
      - epd_internal

networks:
  epd_internal:
    driver: bridge
